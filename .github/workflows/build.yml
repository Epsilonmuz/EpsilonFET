# Builds Epsilon FET on a Mac on every push, checks it with pluginval,
# and offers the finished VST3 / AU / Standalone as a download (Actions tab > latest run > Artifacts).
name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Every Xcode configuration is optimised (Xcode's Build/Run uses Debug by default)
        run: |
          for cfg in Debug Release; do
            lv=$(xcodebuild -project "Builds/MacOSX/Epsilon FET.xcodeproj" -target "Epsilon FET - Shared Code" \
                   -configuration $cfg -showBuildSettings 2>/dev/null | awk '/ GCC_OPTIMIZATION_LEVEL /{print $3; exit}')
            echo "$cfg: -O$lv"
            if [ "$lv" = "0" ]; then echo "::error::$cfg is unoptimised (-O0): the plugin would stutter on an Intel Mac"; exit 1; fi
          done

      - name: Build (Xcode project generated by Projucer, Release, Universal)
        run: |
          xcodebuild -project "Builds/MacOSX/Epsilon FET.xcodeproj" \
                     -target "Epsilon FET - All" -configuration Release \
                     ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY="-" -quiet build

      - name: Plugin tests (latency, mix alignment, aliasing, automation, CPU on this Mac)
        run: |
          cmake -B testbuild -DCMAKE_BUILD_TYPE=Release -DEF_BUILD_TESTS=ON
          cmake --build testbuild --target EpsilonPluginTest --config Release -j 4
          APP=$(find testbuild -path "*EpsilonPluginTest_artefacts*" -type f -perm -u+x -name EpsilonPluginTest | head -1)
          "$APP" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --skip-gui-tests \
            --validate "Builds/MacOSX/build/Release/Epsilon FET.vst3"

      - name: Package
        run: |
          mkdir -p dist
          cp -R "Builds/MacOSX/build/Release/Epsilon FET.vst3" "Builds/MacOSX/build/Release/Epsilon FET.component" "Builds/MacOSX/build/Release/Epsilon FET.app" dist/
          echo "Architectures:"; for f in dist/*.vst3/Contents/MacOS/* dist/*.component/Contents/MacOS/*; do lipo -archs "$f"; done || true
          cp README.md "Epsilon FET Manual.pdf" dist/ || true
          cat > dist/INSTALL.txt <<'TXT'
          1. Copy "Epsilon FET.vst3" to ~/Library/Audio/Plug-Ins/VST3/
          2. Copy "Epsilon FET.component" to ~/Library/Audio/Plug-Ins/Components/
          3. These builds are not signed with an Apple developer certificate, so run once in Terminal:
             xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"Epsilon FET.vst3" ~/Library/Audio/Plug-Ins/Components/"Epsilon FET.component"
          4. Rescan plugins in your DAW.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: EpsilonFET-macOS
          path: dist
          retention-days: 30
